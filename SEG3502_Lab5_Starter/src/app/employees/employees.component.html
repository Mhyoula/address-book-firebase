
<a class="btn btn-primary" [routerLink]="['/employee']">
  Add Employee
</a>

<div class="container">
  <p *ngIf="employees.loading$ | async">
    Chargement des employés...
  </p>

  <p *ngIf="employees.error$ | async as error" role="alert">
    {{ error }}
  </p>

  <ng-container *ngIf="employees.$ | async as employeeList">
    <p
      *ngIf="
        !(employees.loading$ | async) &&
        !(employees.error$ | async) &&
        employeeList.length === 0
      "
    >
      Aucun employé enregistré.
    </p>

    <table class="table" *ngIf="employeeList.length > 0">
      <thead>
        <tr>
          <th scope="col">Name</th>
          <th scope="col">Date of birth</th>
          <th scope="col">City</th>
          <th scope="col">Salary</th>
          <th scope="col">Gender</th>
          <th scope="col">Email</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let emp of employeeList">
          <td>{{ emp.name }}</td>
          <td>{{ emp.dateOfBirth | date:'d/MMM/y' }}</td>
          <td>{{ emp.city }}</td>
          <td>{{ emp.salary }}</td>
          <td>{{ emp.gender }}</td>
          <td>{{ emp.email }}</td>
        </tr>
      </tbody>
    </table>
  </ng-container>
</div>
